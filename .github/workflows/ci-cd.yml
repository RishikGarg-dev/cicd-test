name: React CI/CD to Docker Hub

# 1. TRIGGERS: When should this run?
on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run the build manually from the UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Uses a fresh GitHub-hosted machine

    steps:
      # 2. PREP: Get the code and set up Docker
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. AUTH: Log into Docker Hub using Secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 4. METADATA: Determine the tags (e.g., 'main' becomes 'latest')
      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/ament-react-app
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # 5. BUILD & PUSH: Execute the Docker build and upload
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Caching: Speeds up subsequent builds by storing layers
          cache-from: type=gha
          cache-to: type=gha,mode=max